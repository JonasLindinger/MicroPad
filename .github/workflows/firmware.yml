# AI-assisted development — firmware, HA automation, config generator and docs were created with AI (LLM) help, reviewed and tested by the author. Provided as-is, without warranty; verify on your own hardware, don't use for safety-critical applications.
#
# Firmware CI: host/static checks (no toolchain) plus a real three-FQBN
# ESP32-S3 compile matrix over Arduino CLI 1.5.1 and the pinned core/libraries
# from arduino-cli.yaml. No serial logs or credentials are ever uploaded; the
# compiled binaries are published to GitHub Releases only on tagged pushes.
name: firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'firmware/**'
      - 'tests/firmware/**'
      - 'scripts/**'
      - 'arduino-cli.yaml'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'tests/firmware/**'
      - 'scripts/**'
      - 'arduino-cli.yaml'
      - '.github/workflows/firmware.yml'

jobs:
  host-static:
    name: Host + static firmware tests (no toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host and static firmware suites
        run: ./scripts/test-firmware-host.sh
        # No Arduino CLI here: the compile-matrix wrapper's real-compile case
        # self-skips with the explicit reason; print-matrix and staging always run.

  build:
    name: Compile ${{ matrix.fqbn }}
    runs-on: ubuntu-latest
    needs: host-static
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - "esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi"
          - "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,PSRAM=opi"
          - "esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=default,PSRAM=disabled"
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"
      - name: Install and verify pinned toolchain (core 3.3.11 + libraries)
        run: ./scripts/install-arduino-toolchain.sh
      - name: Compile firmware
        run: ./scripts/compile-firmware.sh --one "${{ matrix.fqbn }}"
      - name: Collect binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: micropad-${{ matrix.fqbn }}
          path: build/arduino/MicroPad_HA_Controller/build/**/*.bin

  release:
    name: Publish firmware binaries
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish binaries to the tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.bin