# MicroPad Controller - Home Assistant automation example
# Generated by the MicroPad Config Generator (AI-assisted; reviewed by the author).
# Provided as-is, without warranty - verify before use in your own setup.
#
- alias: MicroPad Controller
  description: Generated by MicroPad Config Generator
  trigger:
  - platform: mqtt
    topic: micropad/event
  variables:
    action: '{{ trigger.payload_json.action }}'
    entity: '{{ trigger.payload_json.entity | default('''') }}'
    value: '{{ trigger.payload_json.value | default('''') }}'
    target_page: '{{ trigger.payload_json.target_page | default('''') }}'
    page_id: '{{ trigger.payload_json.page_id | default('''') }}'
  action:
  - choose:
    - conditions:
      - '{{ action == ''home'' }}'
      sequence:
      - service: mqtt.publish
        data:
          topic: micropad/page/current
          payload: |-
            {
              "page_id": "home",
              "title": "Home",
              "items": [
                {
                  "name": "Lights",
                  "type": "category",
                  "target_page": "lights"
                },
                {
                  "name": "Printer",
                  "type": "category",
                  "target_page": "printer"
                },
                {
                  "name": "Settings",
                  "type": "settings"
                }
              ]
            }
    - conditions:
      - '{{ action == ''navigate'' }}'
      - '{{ target_page == ''lights'' }}'
      sequence:
      - service: mqtt.publish
        data:
          topic: micropad/page/current
          payload: |-
            {
              "page_id": "lights",
              "title": "Lights",
              "items": [
                {
                  "name": "Desk Lamp",
                  "type": "light",
                  "entity": "light.desk_lamp",
                  "state": "{{ states('light.desk_lamp') }}"
                },
                {
                  "name": "Living Room",
                  "type": "light",
                  "entity": "light.living_room",
                  "state": "{{ states('light.living_room') }}"
                }
              ],
              "parent": "home"
            }
    - conditions:
      - '{{ action == ''navigate'' }}'
      - '{{ target_page == ''printer'' }}'
      sequence:
      - service: mqtt.publish
        data:
          topic: micropad/page/current
          payload: |-
            {
              "page_id": "printer",
              "title": "3D Printer",
              "items": [
                {
                  "name": "State",
                  "type": "sensor",
                  "entity": "sensor.bambu_stage",
                  "state": "{{ states('sensor.bambu_stage') }}"
                },
                {
                  "name": "Progress",
                  "type": "sensor",
                  "entity": "sensor.bambu_print_progress",
                  "state": "{{ states('sensor.bambu_print_progress') }}%"
                },
                {
                  "name": "Nozzle Target",
                  "type": "number",
                  "entity": "number.x1c_nozzle_target",
                  "min": 0,
                  "max": 300,
                  "step": 5,
                  "editable": true,
                  "value": "{{ states('number.x1c_nozzle_target') }}"
                }
              ],
              "parent": "home"
            }
    - conditions:
      - '{{ action == ''toggle'' }}'
      sequence:
      - service: homeassistant.toggle
        target:
          entity_id: '{{ entity }}'
      - service: mqtt.publish
        data:
          topic: micropad/page/current
          retain: true
          payload: |-
            {% if false %}{% endif %}
            {% if page_id == 'lights' %}
            {
              "page_id": "lights",
              "title": "Lights",
              "items": [
                {
                  "name": "Desk Lamp",
                  "type": "light",
                  "entity": "light.desk_lamp",
                  "state": "{{ states('light.desk_lamp') }}"
                },
                {
                  "name": "Living Room",
                  "type": "light",
                  "entity": "light.living_room",
                  "state": "{{ states('light.living_room') }}"
                }
              ],
              "parent": "home"
            }
            {% endif %}
    - conditions:
      - '{{ action == ''edit'' }}'
      sequence:
      - choose:
        - conditions:
          - '{{ entity.startswith(''number.'') }}'
          sequence:
          - service: number.set_value
            target:
              entity_id: '{{ entity }}'
            data:
              value: '{{ value }}'
        - conditions:
          - '{{ entity.startswith(''input_number.'') }}'
          sequence:
          - service: input_number.set_value
            target:
              entity_id: '{{ entity }}'
            data:
              value: '{{ value }}'
      - service: mqtt.publish
        data:
          topic: micropad/page/current
          retain: true
          payload: |-
            {% if page_id == 'printer' %}
            {
              "page_id": "printer",
              "title": "3D Printer",
              "items": [
                {
                  "name": "State",
                  "type": "sensor",
                  "entity": "sensor.bambu_stage",
                  "state": "{{ states('sensor.bambu_stage') }}"
                },
                {
                  "name": "Progress",
                  "type": "sensor",
                  "entity": "sensor.bambu_print_progress",
                  "state": "{{ states('sensor.bambu_print_progress') }}%"
                },
                {
                  "name": "Nozzle Target",
                  "type": "number",
                  "entity": "number.x1c_nozzle_target",
                  "min": 0,
                  "max": 300,
                  "step": 5,
                  "editable": true,
                  "value": "{{ states('number.x1c_nozzle_target') }}"
                }
              ],
              "parent": "home"
            }
            {% endif %}
    - conditions:
      - '{{ action == ''get_all_pages'' }}'
      sequence:
      - service: mqtt.publish
        data:
          topic: micropad/pages/all
          retain: true
          payload: |-
            {
              "pages": [
            {
              "page_id": "home",
              "title": "Home",
              "items": [
                {
                  "name": "Lights",
                  "type": "category",
                  "target_page": "lights"
                },
                {
                  "name": "Printer",
                  "type": "category",
                  "target_page": "printer"
                },
                {
                  "name": "Settings",
                  "type": "settings"
                }
              ]
            },
            {
              "page_id": "lights",
              "title": "Lights",
              "items": [
                {
                  "name": "Desk Lamp",
                  "type": "light",
                  "entity": "light.desk_lamp",
                  "state": "{{ states('light.desk_lamp') }}"
                },
                {
                  "name": "Living Room",
                  "type": "light",
                  "entity": "light.living_room",
                  "state": "{{ states('light.living_room') }}"
                }
              ],
              "parent": "home"
            },
            {
              "page_id": "printer",
              "title": "3D Printer",
              "items": [
                {
                  "name": "State",
                  "type": "sensor",
                  "entity": "sensor.bambu_stage",
                  "state": "{{ states('sensor.bambu_stage') }}"
                },
                {
                  "name": "Progress",
                  "type": "sensor",
                  "entity": "sensor.bambu_print_progress",
                  "state": "{{ states('sensor.bambu_print_progress') }}%"
                },
                {
                  "name": "Nozzle Target",
                  "type": "number",
                  "entity": "number.x1c_nozzle_target",
                  "min": 0,
                  "max": 300,
                  "step": 5,
                  "editable": true,
                  "value": "{{ states('number.x1c_nozzle_target') }}"
                }
              ],
              "parent": "home"
            }
              ]
            }
  mode: queued
  max: 10
  id: micropad_controller
